<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RR.HH. x Home &amp; Cook</title>
<meta name="description" content="Plataforma de Recursos Humanos de la red de tiendas Home &amp; Cook, Groupe SEB.">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="RRHH H&amp;C">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#1C2733; --muted:#5E6B78; --line:#D9DEE5; --mist:#F2F4F7; --paper:#FFFFFF;
  --red:#E52143; --red-d:#B8142F;
  --l0:#B42318; --l05:#C4640A; --l1:#3E5C76; --l15:#0F7B6C; --l2:#1B7A2F;
  --warn:#8A5300; --warnbg:#FFF4E0; --errbg:#FDECEA; --okbg:#E7F4EA;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--mist)}
.num,.n,td.n,input.numin{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:650}
h3{font-size:15px;font-weight:650;margin-bottom:6px}
small{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 20px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.mark{display:inline-block;width:14px;height:14px;background:var(--red);border-radius:2px}
.rm{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.rm input{width:170px}
.spacer{flex:1}
.saved{font-size:13px;color:var(--muted)}
.saved.warn{color:var(--warn)} .saved.bad{color:var(--l0)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
textarea{resize:vertical;min-height:34px;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 2px rgba(28,39,51,.12)}
input.numin{text-align:right;max-width:130px}
input.short{max-width:80px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled input,fieldset:disabled textarea,fieldset:disabled select{background:var(--mist);color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-d)}
.btn.danger{color:var(--l0)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn:disabled{opacity:.5;cursor:default}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside#side{background:var(--paper);border-right:1px solid var(--line);padding:18px 14px;overflow:auto;position:sticky;top:58px;height:calc(100vh - 58px)}
main{padding:22px 28px 60px;max-width:1300px;width:100%}
.side-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stores{list-style:none;margin:0;padding:0}
.stores>li{border-radius:8px;margin-bottom:4px}
.stores>li>button{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.stores>li>button:hover{background:var(--mist)}
.stores>li.on>button{background:var(--solid);color:#fff}
.stores>li.on .ph.pendiente{border-color:#7C8896}
.sname{font-weight:600}
.people{list-style:none;margin:0 0 6px;padding:0 10px;font-size:13px;color:var(--muted)}
.stores>li:not(.on) .people{display:none}
.people small{margin-left:4px}
.phases{display:flex;gap:3px;align-items:center;margin-top:3px}
.ph{width:7px;height:7px;border-radius:50%;font-size:0;padding:0;background:var(--line);flex:none}
.ph.cerrado{background:var(--l2)}
.ph.curso{background:var(--l05)}
.ph.vacio{opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--mist);font-size:11.5px;color:var(--muted)}
.legend .ph{margin-right:4px}
.legend .ph{min-width:18px}

.steps{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.step{border:0;background:transparent;padding:10px 14px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:12px}
.step.on{color:var(--ink);border-bottom-color:var(--red)}
.step.on b{background:var(--solid);border-color:var(--solid);color:#fff}
.step.aux{margin-left:auto;font-weight:500}
.step:disabled{opacity:.4;cursor:default}
h1.store{margin-bottom:16px}
h1.store small{font-size:15px;font-weight:500;margin-left:6px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.card>h2{margin-bottom:10px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 12px}
.muted{color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--mist);color:var(--muted)}
.badge.ok{background:var(--okbg);color:var(--l2)}
.notice{background:var(--warnbg);border:1px solid #E8C27A;color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.right{display:flex;align-items:flex-end;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid2>*,.grid3>*{min-width:0}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.span2{grid-column:span 2}
.empty{color:var(--muted)}
.empty.big{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:48px;text-align:center;margin-top:20px}
.empty.big h1{color:var(--ink);margin-bottom:8px}
.empty.big .btn{margin:14px 4px 0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--mist);vertical-align:middle}
th.n,td.n{text-align:right}
td small{display:block;font-size:12px}
td.inv{display:flex;gap:10px;justify-content:flex-end}
td.inv label{font-size:12px}
table.mini td{padding:5px 8px}
.fac{display:inline-block;min-width:48px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.f0{color:var(--l0)} .f05{color:var(--l05)} .f1{color:var(--l1)} .f15{color:var(--l15)} .f2{color:var(--l2)}
.err{color:var(--l0);font-weight:600}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:7px 16px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:baseline}
.pill small{font-weight:500}
.pill.on{background:var(--solid);border-color:var(--solid);color:#fff}
.pill.on small{color:#C9D1DA}

.evalgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
/* Valoración cualitativa: una fila por ítem, detalle plegado */
.card.eval{padding-top:16px}
.eval-h{margin-bottom:4px}
.eval-t{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.eval-h h2{margin:0}
.eval-h small{color:var(--muted);font-size:13px}
.eval-h .prog{display:block;height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px}
.eval-h .prog span{display:block;height:100%;background:var(--l2);border-radius:3px;transition:width .25s}
.blq{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-size:12px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.blq i{flex:1;height:1px;background:var(--line)}
.blq .num{text-transform:none;letter-spacing:0;font-weight:600}
.it{border-top:1px solid var(--mist)}
.it:first-of-type,.blq + .it{border-top:0}
.it-h{display:flex;align-items:center;gap:10px;padding:7px 0;min-height:44px}
.it-h b{font-weight:600;flex:1;min-width:0;line-height:1.3}
.it-h .w{white-space:nowrap;font-size:12px;color:var(--muted);flex:none}
.it.hecho .it-h b{color:var(--muted)}
.it-mas{flex:none;width:30px;height:30px;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:6px;cursor:pointer;font-size:14px;line-height:1}
.it-mas:hover{border-color:var(--ink);color:var(--ink)}
.it.abierto .it-mas{background:var(--mist);color:var(--ink)}
.it-mas.lleno{color:var(--l1);border-color:var(--l1)}
.it-body{display:none;padding:0 0 12px 2px}
.it.abierto .it-body{display:block}
.it-body .guia{margin:0 0 6px;font-size:13px;color:var(--muted);line-height:1.45}
.it-body .nivel{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.it-body textarea{font-size:14px}
.scale{display:flex;align-items:center;gap:3px;flex:none}
.lv{width:40px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.lv:hover{border-color:var(--ink)}
.lv.on{color:#fff}
.lv0.on{background:var(--l0);border-color:var(--l0)} .lv05.on{background:var(--l05);border-color:var(--l05)}
.lv1.on{background:var(--l1);border-color:var(--l1)} .lv15.on{background:var(--l15);border-color:var(--l15)}
.lv2.on{background:var(--l2);border-color:var(--l2)}
fieldset:disabled .lv{cursor:default}
fieldset:disabled .lv:not(.on){opacity:.45}

@media (max-width:1100px){.it-h{flex-wrap:wrap}.it-h b{flex-basis:100%}.scale{margin-left:auto}}
.ticket{position:sticky;top:78px;background:var(--solid);color:#fff;border-radius:12px;padding:20px}
.ticket small{color:#AEB9C5}
.t-per{margin:0;font-size:13px;color:#AEB9C5}
.t-lbl{margin:10px 0 0;font-weight:600}
.t-big{margin:2px 0 0;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.t-sub{margin:4px 0 16px;font-size:13px;color:#AEB9C5}
.t-rows{margin:0;border-top:1px dashed #4A5868;padding-top:10px}
.t-rows dt{font-size:13px;color:#C9D1DA;margin-top:10px}
.t-rows dt small{margin-left:6px}
.t-rows dd{margin:2px 0 0;display:flex;align-items:baseline;gap:6px;font-weight:650}
.t-rows dd span{margin-left:auto;font-weight:500;color:#C9D1DA}
.t-rows dd.nota{font-size:22px}
.alerts{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.alerts li{font-size:13px;border-radius:6px;padding:6px 10px;background:#2E3B49}
.alerts li.aviso{border-left:3px solid #E8A33D}
.alerts li.error{border-left:3px solid #F0766A}
.closed{font-size:13px;margin:14px 0 0;color:#9BE3AE}
.ticket .btn{border-color:#4A5868;background:transparent;color:#fff}
.ticket .btn:hover{border-color:#fff}
.ticket .btn.primary{background:var(--red);border-color:var(--red)}
.ticket .btn.ghost{color:#AEB9C5;border-color:transparent}

.vg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.vg-o{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;color:var(--ink);gap:2px}
.vg-o input{display:none}
.vg-o.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vg-o small{font-size:12px}
.pre{white-space:pre-wrap;color:var(--ink);font-size:14px}
.prose p{max-width:75ch;margin:8px 0}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--solid);color:#fff;padding:9px 18px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
#print{display:none}

@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside#side{border-right:0;border-bottom:1px solid var(--line);position:static;height:auto}
  .rm{flex:1 1 140px}
  .evalgrid{grid-template-columns:1fr}
  .ticket{position:static}
  .vg{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  main{padding:16px}
  .grid2,.grid3{grid-template-columns:1fr} .span2{grid-column:auto}
  .scale{justify-content:flex-start}
  .rm input{width:130px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
@media print{
  body{background:#fff}
  header.top,.layout,#toast,#vista,.demo-bar{display:none!important}
  #print{display:block;font-size:11px;color:#000}
  #print h1{font-size:18px} #print h2{font-size:14px;margin:14px 0 6px;border-bottom:1px solid #000;padding-bottom:3px}
  #print table{margin:6px 0;font-size:10.5px} #print th,#print td{border:1px solid #bbb;padding:3px 5px;color:#000}
  #print .firmas{display:flex;gap:40px;margin-top:40px} #print .firmas div{flex:1;border-top:1px solid #000;padding-top:4px}
  #print .meta{color:#333}
}

.page{max-width:1400px;margin:0 auto;padding:22px 28px 60px}
.page>h1,.page-h{margin-bottom:16px}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 18px}
.filters label{min-width:160px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--solid);color:#fff}
.kpis{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.kpis div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpis div:first-child{background:var(--solid);color:#fff;border-color:var(--ink)}
.kpis div:first-child small{color:#AEB9C5}
.kpis b{display:block;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--mist)}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.st.cerrado{background:var(--okbg);color:var(--l2)} .st.completo{background:var(--infobg);color:var(--l1)}
.st.encurso{background:var(--warnbg);color:var(--warn)} .st.pendiente{background:var(--mist);color:var(--muted)}
.flag{color:var(--warn);font-size:12px;display:block}
.flag.e{color:var(--l0)}
.dev.pos{color:var(--l2);font-weight:600} .dev.neg{color:var(--l0);font-weight:600} .dev.alta{background:var(--warnbg);border-radius:4px;padding:1px 5px}

/* Plataforma */
.logo{display:block;flex:none}
.brand .logo{width:36px;height:36px}
/* Las pestañas del apartado van en su propia fila, debajo de la cabecera */
.mainnav{order:9;flex-basis:100%;display:flex;gap:0;min-width:0;margin:4px -20px -8px;padding:0 14px;
  border-top:1px solid var(--mist);overflow-x:auto;scrollbar-width:thin}
.mainnav button{white-space:nowrap;flex:none;border:0;background:transparent;padding:9px 12px 8px;
  cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.mainnav button:hover{color:var(--ink)}
.mainnav button.on{color:var(--ink);border-bottom-color:var(--red)}
.user{position:relative}
.user summary{list-style:none;cursor:pointer;padding:6px 10px;border-radius:6px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.user summary::-webkit-details-marker{display:none}
.user summary:hover{background:var(--mist)}
.user .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(28,39,51,.12);min-width:210px;padding:6px;z-index:10}
.user .menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer}
.user .menu button:hover{background:var(--mist)}
.demo-bar{background:var(--warnbg);color:var(--warn);text-align:center;font-size:13px;padding:6px}
.layout{min-height:calc(100vh - 53px)}
aside#side{top:53px;height:calc(100vh - 53px)}
.grp{font-size:12px;font-weight:600;color:var(--muted);margin:14px 10px 4px}
.loading{display:grid;place-items:center;height:100vh;color:var(--muted)}

.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(circle at 12% 0%, rgba(229,33,67,.13), transparent 55%),
  radial-gradient(circle at 92% 100%, rgba(62,92,118,.12), transparent 55%), var(--mist)}
.login-wrap{width:100%;max-width:960px;display:grid;grid-template-columns:1.06fr 1fr;background:var(--paper);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 26px 60px rgba(28,39,51,.14)}

/* Panel de marca */
.login-marca{background:linear-gradient(160deg,#E52143 0%,#C4152F 55%,#9C0F26 100%);color:#fff;
  display:flex;flex-direction:column;position:relative;min-height:520px;min-width:0;overflow:hidden}
.login-marca .lm-seb{display:flex;align-items:center;gap:10px;padding:22px 26px 0;font-size:12.5px;color:rgba(255,255,255,.88);font-weight:600}
.login-marca .chipseb{box-shadow:none;border-color:transparent;padding:6px 10px}
.login-marca .lm-centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:20px 30px 26px;text-align:center}
.login-marca .logo{margin:0 0 14px;box-shadow:0 8px 26px rgba(0,0,0,.18)}
.login-marca .marca{color:#fff}
.login-marca .marca .equis{stroke:#FFC9D3}
.login-marca .lm-lema{margin:14px 0 0;max-width:19em;font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.9)}
.login-marca .marcas{position:static;border-top:0;border-radius:0;padding:14px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 17%,#000 83%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 17%,#000 83%,transparent)}
.login-marca .cinta{gap:40px;animation-duration:34s}

/* Columna del formulario */
.login-lado{position:relative;min-width:0;padding:34px 34px 22px;display:flex;flex-direction:column;justify-content:center;background:var(--paper)}
.login-card{display:flex;flex-direction:column;gap:13px}
.login-card h1{font-size:23px}
.login-card .sub{color:var(--muted);margin:-9px 0 4px;font-size:14px;line-height:1.45}
.login-card h1 i{font-style:normal;color:var(--red)}
.login-card input{padding:10px 12px;font-size:15px}
.login-card .btn{padding:11px;font-size:15px;text-align:center;text-decoration:none}
.login-lado .btn{padding:11px;font-size:15px;text-align:center;text-decoration:none;display:block;width:100%;color:var(--ink)}
.login-lado a.btn:hover{border-color:var(--ink)}
.login-lado .btn.primary{color:#fff}
.login-err{color:var(--l0);font-size:14px;min-height:20px;margin:0}
.login-card .login-err:empty{display:none}
.demo-note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin:0}
.campo-pass{position:relative;display:block}
.campo-pass input{padding-right:42px}

@media (max-width:1000px){ .kpis{grid-template-columns:1fr 1fr} aside#side{top:auto;height:auto;position:static;max-height:50vh} }

:root{--solid:#1C2733;--infobg:#E6EEF6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header.top{top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E4E9EE;--muted:#9AA6B2;--line:#34404C;--mist:#12181E;--paper:#1B232B;--solid:#0B1015;--okbg:#173522;--warnbg:#3A2A10;--errbg:#3B1818;--warn:#F0B35A;--l1:#6B8FB3;--l2:#3FA35A;--infobg:#1D2C3C;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E4E9EE;--muted:#9AA6B2;--line:#34404C;--mist:#12181E;--paper:#1B232B;--solid:#0B1015;--okbg:#173522;--warnbg:#3A2A10;--errbg:#3B1818;--warn:#F0B35A;--l1:#6B8FB3;--l2:#3FA35A;--infobg:#1D2C3C;color-scheme:dark}
.ticket,.kpis div:first-child{border:1px solid var(--line)}
.logo{background:#fff;border-radius:50%}

/* Portal y Talent Matrix */
.brand{border:0;background:transparent;cursor:pointer;color:inherit}
.brand span i,.home-h h1 i{font-style:normal;color:var(--red)}
.modname{font-weight:600;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
.home{max-width:1100px;margin:0 auto;padding:40px 28px 60px}
.home-h{display:flex;gap:22px;align-items:center;margin-bottom:26px}
.home-txt{min-width:0;flex:1}
.home-h h1{font-size:30px}
.home-h p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.adminbar{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 20px;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:.15s}
.adminbar:hover{border-color:var(--ink)}
.adminbar-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.adminbar-t b{font-size:15px;font-weight:650}
.adminbar-t small{color:var(--muted);font-size:13px}
.adminbar-f{flex:none;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.adminbar:hover .adminbar-f{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mod{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:.15s}
.mod:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.10)}
.mod-t{font-size:18px;font-weight:650;display:flex;gap:10px;align-items:center}
.mod-n{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.mod-d{color:var(--muted);font-size:14px;line-height:1.5}
.mod-f{margin-top:auto;padding-top:12px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mod.pendiente{opacity:.7;cursor:default}.mod.pendiente:hover{transform:none;border-color:var(--line);box-shadow:none}
.mod.pendiente .mod-f,.mod.admin .mod-f{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px;color:inherit}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--solid);border-color:var(--solid);color:#fff}
fieldset:disabled .chip{cursor:default;opacity:.6}
.prio{display:inline-block;padding:4px 12px;border-radius:14px;font-weight:600;font-size:13px}
.prio.pSeguimientonormal{background:var(--okbg);color:var(--l2)}
.prio.pVigilar{background:var(--warnbg);color:var(--warn)}
.prio.pActuarya{background:var(--errbg);color:var(--l0)}
.prio.mini{min-width:44px;text-align:center;padding:3px 8px}
.lblmini{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.box9{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0}
.b9{height:24px;border-radius:4px;background:#3A4A5B}
.b9.on{background:var(--red)}
.grid9{display:grid;grid-template-columns:130px repeat(3,1fr);gap:8px}
.ejeY{display:flex;align-items:center;justify-content:flex-end;text-align:right;font-size:12px;font-weight:600;color:var(--muted)}
.ejeX{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-top:4px}
.c9{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:100px;background:var(--mist)}
.c9.n0{background:var(--errbg)}.c9.n8{background:var(--okbg)}
.c9h{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px}
.c9 ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.c9 li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:13px;font-weight:600;color:inherit}
.c9 li button:hover{border-color:var(--red)}
.c9 li small{display:block;font-weight:400}
.ticket .t-rows dd small{color:#AEB9C5}
@media (max-width:900px){.grid9{grid-template-columns:1fr}.ejeY{justify-content:flex-start;margin-top:8px}.ejeX{display:none}}
@media (max-width:640px){.home{padding:24px 16px}.modname{display:none}.home-h{flex-direction:column;align-items:flex-start;gap:12px}.home-h .logo{width:60px;height:60px}
.adminbar{flex-direction:column;align-items:flex-start;gap:8px}.hoy-l small{display:none}.hoy{padding:16px 14px}}

/* Apartados nuevos y People Data Centre */
:root{--oro:#A9821F;--oro-bg:#FBF3DC;--oro-line:#DFC372}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--oro:#E3C05C;--oro-bg:#33290E;--oro-line:#6E5A1E}}
:root[data-theme="dark"]{--oro:#E3C05C;--oro-bg:#33290E;--oro-line:#6E5A1E}
h2.grupo{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 12px}
h2.grupo:first-of-type{margin-top:0}
.badge.oro{background:var(--oro-bg);color:var(--oro);border:1px solid var(--oro-line)}
.mod.destacado{border:1px solid var(--oro-line);background:linear-gradient(180deg,var(--oro-bg),var(--paper) 70%)}
.mod.destacado:hover{border-color:var(--oro);box-shadow:0 10px 30px rgba(169,130,31,.22)}
.mod.destacado .mod-f{color:var(--oro)}
.mod-k{display:flex;flex-wrap:wrap;gap:6px}
.mod-k i{font-style:normal;font-size:12px;font-weight:600;color:var(--oro);background:var(--paper);border:1px solid var(--oro-line);border-radius:12px;padding:3px 9px}
.pdc h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lead{color:var(--muted);max-width:75ch;margin:0 0 20px;font-size:15px}
.kpis-pdc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.kpi-card{border-top:3px solid var(--oro-line);position:relative}
.kpi-card h2{font-size:16px;margin-bottom:6px;padding-right:32px}
.kpi-n{position:absolute;top:16px;right:18px;font-size:22px;font-weight:700;color:var(--oro-line);font-variant-numeric:tabular-nums}
.kpi-q{color:var(--muted);font-size:14px;margin:0 0 10px}
.kpi-f,.kpi-d{font-size:13px;margin:4px 0}
.kpi-f b,.kpi-d b{color:var(--ink)}
.lista{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.lista li{margin:4px 0}

/* Acceso de invitado y cuestionarios */
.guest{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -20%,rgba(229,33,67,.10),transparent 60%),var(--mist)}
.guest.wide{place-items:start center;padding:24px 16px 60px}
.guest-card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px 30px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(28,39,51,.08)}
.guest-card.wide{max-width:720px}
.guest-card .logo{margin:0 auto 4px}
.guest-card h1{text-align:center;font-size:23px}
.guest-card .sub{text-align:center;color:var(--muted);margin:-8px 0 4px;font-size:14px}
.guest-h{display:flex;gap:14px;align-items:center}
.guest-h .logo{margin:0}
.guest-h h1,.guest-h .sub{text-align:left;margin:0}
.guest-card .intro{margin:0;font-size:15px}
.guest-card .aviso{margin:0;background:var(--mist);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{border-top:1px solid var(--mist);padding:16px 0 4px}
.qt{display:flex;gap:10px;font-weight:600;margin:0 0 10px;line-height:1.45}
.qn{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--mist);color:var(--muted);font-size:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;color:inherit;line-height:1.4}
.opt:hover{border-color:var(--ink)}
.opt.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--paper));font-weight:600}
.likert{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lk{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 8px;cursor:pointer;font-size:13px;color:inherit}
.lk:hover{border-color:var(--ink)}
.lk.on{background:var(--solid);border-color:var(--solid);color:#fff;font-weight:600}
.guest-f{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.bar{display:block;height:8px;border-radius:5px;background:var(--mist);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:5px}
.coment{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.coment li{background:var(--mist);border-radius:8px;padding:10px 12px;font-size:14px}
.cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.06em}
.modal{position:fixed;inset:0;background:rgba(10,14,19,.55);display:grid;place-items:center;padding:20px;z-index:40}
.modal-c{background:var(--paper);border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
.ruta-inv{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.ruta-inv .ruta-linea{flex:1;position:static}
.ruta-inv .muted{font-size:13px;white-space:nowrap}
.curso-inv .paso{border:1px solid var(--line);border-radius:12px;padding:20px}
.nota-inv{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;border-radius:12px;padding:18px;margin:18px 0}
.nota-inv b{font-size:30px;line-height:1.1}
.nota-inv span{font-size:14px}
.nota-inv.ok{background:var(--okbg);color:var(--l2)}
.nota-inv.ko{background:var(--warnbg);color:var(--warn)}
.repaso{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.repaso li{border:1px solid var(--line);border-left:3px solid var(--l2);border-radius:0 10px 10px 0;padding:12px 16px;display:grid;gap:4px}
.repaso li.ko{border-left-color:var(--l0)}
.repaso b{font-size:14.5px;line-height:1.45}
.repaso span{font-size:13.5px;color:var(--ink)}
.repaso small{color:var(--muted);line-height:1.5}
.papeletas h1{font-size:19px;margin:0 0 4px}
.pap-sub{color:#555;font-size:12px;margin:0 0 14px}
.pap-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pap{border:1px dashed #999;border-radius:8px;padding:12px 14px;display:grid;gap:3px;break-inside:avoid}
.pap b{font-size:12px}
.pap-url{font-size:11px;color:#555;word-break:break-all}
.pap code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:.06em}
.pap small{font-size:10.5px;color:#666}
.celda{display:inline-block;min-width:44px;padding:2px 8px;border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums}
.celda.ok{background:var(--okbg);color:var(--l2)}
.celda.medio{background:var(--warnbg);color:var(--warn)}
.celda.no{background:var(--errbg);color:var(--l0)}
tr.fila-off td{opacity:.55}
input.chk{width:auto;margin:0}
small.mail{color:var(--muted);word-break:break-all}
.aviso-anon{background:var(--mist);border-left:3px solid var(--l1);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5}
.modal-c.estrecho{max-width:460px}
.modal-c.estrecho h2{margin:0 0 10px;font-size:19px}
.conf-t{color:var(--muted);margin:0;line-height:1.55}
.conf-e{margin-top:16px}
.conf-e b{color:var(--ink)}
.btn.peligro{background:var(--l0);border-color:var(--l0);color:#fff}
.btn.peligro:hover{filter:brightness(.92)}
.btn.peligro:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.peligro-g{color:var(--l0);border-color:var(--line)}
.btn.peligro-g:hover{border-color:var(--l0)}
.page-h-b{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.fila-acc{display:inline-flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.card-h .btn.small{margin-left:auto}
.resp{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.resp li{border-top:1px solid var(--mist);padding-top:10px;font-size:14px}
.resp li b{display:block;font-weight:600;margin-bottom:3px}
.resp li span{color:var(--muted)}
@media (max-width:640px){.likert{grid-template-columns:1fr 1fr}.guest-card{padding:24px 18px}}

/* Idiomas, eNPS y cuadro de mando */
.langsel{display:flex;gap:2px;background:var(--mist);border-radius:8px;padding:2px}
.langsel button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;cursor:pointer;letter-spacing:.04em}
.langsel button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.login-lado .langsel,.guest-card .langsel{position:absolute;top:14px;right:14px}
.guest-card{position:relative}
.guest-card .hint a,.login-card .hint a{color:var(--red);font-weight:600}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.np{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 0;cursor:pointer;font-weight:700;color:inherit;font-variant-numeric:tabular-nums}
.np:hover{border-color:var(--ink)}
.np.on.d{background:var(--l0);border-color:var(--l0);color:#fff}
.np.on.p{background:var(--l05);border-color:var(--l05);color:#fff}

.enps{font-size:40px;font-weight:700;margin:6px 0 0;font-variant-numeric:tabular-nums}
.enps.ok{color:var(--l2)}.enps.mal{color:var(--l0)}
.kpis-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.kpis-top .kpi-b{background:var(--solid);color:#fff;border-color:var(--solid)}
.kpis-top .kpi-b small{color:#AEB9C5}
.kpis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi-b{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi-b b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-b small{font-size:12px;color:var(--muted)}
.bar2{display:flex;flex-direction:column;gap:3px;width:100%}
.bar2 i{display:block;height:7px;border-radius:4px;max-width:100%}
.bar2 i.t{background:var(--l1)} .bar2 i.p{background:var(--oro)}
.leyenda{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 8px}
.leyenda.t{background:var(--l1)} .leyenda.p{background:var(--oro)}
.pdc .grupo{margin-top:26px}
@media (max-width:640px){.nps{grid-template-columns:repeat(6,1fr)}.likert.l5{grid-template-columns:1fr 1fr}}

/* Logotipo dibujado, Groupe SEB y cinta de marcas */
.marca{display:inline-flex;align-items:center;gap:.10em;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap;color:inherit}
.marca .equis{display:block;margin:0 .06em;flex:none}
.marca.grande{letter-spacing:-.025em}
.marcacaja{display:flex;justify-content:center;margin:6px 0 4px}
.brand{gap:12px}
.brand .marca{color:var(--ink)}
.brand{gap:10px}

.mod.externo{text-decoration:none;background:var(--mist)}

/* Role play */
.aviso-ia{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:11px 14px;font-size:13.5px;margin:10px 0 16px}
.bad{background:var(--errbg);color:var(--l0);border-radius:10px;padding:11px 14px;font-size:14px;margin:10px 0}
.esc-rp{display:grid;gap:10px}
.esc-rp .escena{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;color:inherit;transition:.15s}

.esc-rp .escena b{display:block;margin-bottom:3px}
.esc-rp .escena .hint{display:block}

/* Arcade */
.arc{--suelo:#E7DCCB;--pared:#F6F1E8;--madera:#C9A227}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .arc{--suelo:#2A2620;--pared:#221F1A}}
/* ---------- Cabecera de partida ---------- */
.arc .hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}
.arc .hud div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.arc .hud small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.arc .hud b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.arc .reloj{position:relative;overflow:hidden}
.arc .reloj i{position:absolute;left:0;bottom:0;height:3px;background:var(--red);transition:width .2s linear}

/* ---------- Tienda ---------- */
.arc .tienda{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(var(--pared) 0 62%,var(--suelo) 62% 100%);height:250px;margin-bottom:12px}
.arc .rotulo{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 14px;border-radius:20px}
.arc .mueble{position:absolute;bottom:38%;border-radius:4px}
.arc .lineal{left:4%;width:26%;height:54px;background:var(--madera);opacity:.85}
.arc .lineal2{left:34%;width:22%;height:40px;background:var(--madera);opacity:.6}
.arc .mesa{left:60%;width:16%;height:30px;background:var(--red);opacity:.5}
.arc .caja{right:3%;width:14%;height:66px;background:var(--solid);opacity:.85;border-radius:6px 6px 2px 2px}
.arc .caja::after{content:"CAJA";position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.arc .clientes{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.arc .zona-g{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.arc .zona-g.caja{justify-content:flex-end}
.arc .cli{width:104px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 8px 6px;cursor:pointer;text-align:center;animation:entra .35s ease-out;box-shadow:0 6px 18px rgba(0,0,0,.10);position:relative}
.arc .cli:hover{border-color:var(--red);transform:translateY(-3px)}
.arc .cli.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,33,67,.18)}
.arc .cli .cara{width:42px;height:42px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.arc .cli .que{font-size:11.5px;line-height:1.25;color:var(--muted);min-height:29px}
.arc .cli .pac{height:6px;border-radius:4px;background:var(--mist);margin-top:6px;overflow:hidden}
.arc .cli .pac i{display:block;height:100%;background:var(--ok);transition:width .2s linear}
.arc .cli.impaciente .pac i{background:var(--warn)}
.arc .cli.critico{animation:tiembla .4s infinite}
.arc .cli.critico .pac i{background:var(--err)}
.arc .cli .zona{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--solid);color:#fff;border-radius:10px;padding:2px 8px;white-space:nowrap}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.arc .flot{position:absolute;font-weight:800;font-size:16px;pointer-events:none;animation:sube 1.1s ease-out forwards;z-index:5}
.arc .flot.bien{color:var(--ok)} .arc .flot.mal{color:var(--err)}
@keyframes sube{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
.arc .vacio{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* ---------- Decisión ---------- */
.arc .dec{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:210px}
.arc .dec .quien{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.arc .dec .quien .cara{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.arc .dec .dice{background:var(--mist);border-radius:12px;border-top-left-radius:4px;padding:10px 14px;font-size:16px;margin-bottom:12px}
.arc .ops{display:grid;gap:8px}
.arc .op{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:11px 14px;cursor:pointer;font-size:15px;line-height:1.35}
.arc .op:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 5%,var(--paper))}
.arc .op:disabled{cursor:default}
.arc .op.buena{border-color:var(--ok);background:var(--okbg)}
.arc .op.mala{border-color:var(--err);background:var(--errbg)}
.arc .eco{margin-top:10px;font-size:14.5px;padding:10px 14px;border-radius:11px;background:var(--mist)}
.arc .eco b{color:var(--ink)}
.arc .paso{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.arc .espera{display:grid;place-items:center;height:100%;min-height:180px;color:var(--muted);text-align:center;padding:20px}

/* ---------- Portada y final ---------- */
.arc .portada{text-align:center;padding:26px 10px}
.arc .portada .sub{color:var(--muted);margin:10px auto 18px;max-width:52ch}
.arc .reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.arc .reglas div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.arc .reglas b{display:block;margin-bottom:3px}
.arc .niveles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.arc .chip{border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:8px 16px;cursor:pointer}
.arc .chip.on{background:var(--solid);border-color:var(--solid);color:#fff;font-weight:650}
.arc .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.arc .res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.arc .res small{display:block;color:var(--muted);font-size:12px}
.arc .res b{font-size:24px;font-variant-numeric:tabular-nums}
.arc .nota{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.arc .consejos{margin:8px 0 0;padding-left:20px}
.arc .consejos li{margin-bottom:6px}
.arc .medalla{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:20px;padding:4px 14px;font-weight:700;font-size:13px;margin-right:6px;margin-bottom:6px}

.arc .chip-arc{border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:8px 16px;cursor:pointer;color:inherit}
.arc .chip-arc.on{background:var(--solid);border-color:var(--solid);color:#fff;font-weight:650}
.arc .btn.grande{padding:13px 26px;font-size:17px}
.arc .paso-et{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.arc .nota-arc{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.arc .medalla{display:inline-block;background:var(--okbg);color:var(--l2);border-radius:20px;padding:4px 14px;font-weight:700;font-size:13px;margin:0 4px 6px 0}
.arc .sub{color:var(--muted);margin:10px auto 16px;max-width:54ch}
.res-arc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.res-arc div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.res-arc small{display:block;color:var(--muted);font-size:12px}
.res-arc b{font-size:23px;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .arc .hud{grid-template-columns:repeat(3,minmax(0,1fr))}
  .arc .hud b{font-size:17px}
  .arc .cli{width:86px;padding:6px 5px 5px}
  .arc .cli .cara{width:34px;height:34px;font-size:13px}
  .arc .cli .que{font-size:10.5px;min-height:26px}
  .arc .tienda{height:230px}
  .arc .clientes{flex-wrap:wrap;gap:6px}
}

  padding:10px 14px;font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5}
